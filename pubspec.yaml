name: scientist_outreach_portal
description: Scientist Outreach Portal â€” offline-first desktop app for Antarctic scientists.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # Local storage (SQLite â€” works on Windows/Linux/macOS/Android/iOS)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3   # required for desktop targets

  # Utilities
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1                  # local IDs before Firestore sync
  intl: ^0.19.0                 # date/time formatting
  connectivity_plus: ^6.1.0    # online/offline detection

  # Device hardware
  geolocator: ^13.0.4           # GPS
  file_picker: ^8.1.3           # CSV, PDF, DOCX, photos

  # State management
  provider: ^6.1.2

  # PIN hashing
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

